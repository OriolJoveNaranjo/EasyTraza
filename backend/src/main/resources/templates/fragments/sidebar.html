<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <aside class="sidebar" th:fragment="sidebar(activePage)">
            <div class="brand">
                <img th:src="@{/images/LogoEasyTraza.PNG}" alt="Logo EasyTraza" class="logo">
                <div class="brand-text">
                    <h2>EasyTraza</h2>
                    <p>Traçabilitat</p>
                </div>
            </div>

            <nav class="menu">
                <a th:href="@{/panell}"
                   th:class="'menu-item' + (${activePage} == 'panell' ? ' active' : '')">
                    Panell
                </a>
                <a th:href="@{/clients}"
                   th:class="'menu-item' + (${activePage} == 'clients' ? ' active' : '')">
                    Clients
                </a>
                <a th:href="@{/proveidors}" th:class="'menu-item' + (${activePage} == 'proveidors' ? ' active' : '')">Proveïdors</a>
                <a th:href="@{/cataleg}" th:class="'menu-item' + (${activePage} == 'cataleg' ? ' active' : '')">Catàleg</a>
                <a th:href="@{/albarans-proveidor}"
                   th:class="'menu-item' + (${activePage} == 'albarans-proveidor' ? ' active' : '')">
                    Albarans proveïdor
                </a>
                <a th:href="@{/lots-proveidor}"
                   th:class="'menu-item' + (${activePage} == 'lots-proveidor' ? ' active' : '')">
                    Lots Proveïdor
                </a>
                <a th:href="@{/albarans-client}"
                   th:class="'menu-item' + (${activePage} == 'albarans-client' ? ' active' : '')">
                    Albarans Client
                </a>
                <a th:href="@{/tracabilitat}"
                   th:class="'menu-item' + (${activePage} == 'tracabilitat' ? ' active' : '')">
                    Traçabilitat
                </a>
                <a href="#" class="menu-item">Controls</a>
                <a th:href="@{/informes}"
                   th:class="'menu-item' + (${activePage} == 'informes' ? ' active' : '')">
                    Informes
                </a>
                <a th:href="@{/usuaris}" th:class="'menu-item' + (${activePage} == 'usuaris' ? ' active' : '')">Usuaris</a>
            </nav>   
            <div class="sidebar-footer">                

                <a th:href="@{/perfil}" class="user-box" th:if="${usuariSessio != null}">

                    <img th:src="${usuariSessio.foto != null and !#strings.isEmpty(usuariSessio.foto)}
                         ? @{${'/uploads/usuaris/' + usuariSessio.foto}}
                         : @{/images/usuaris/fotoPerfil.png}"
                         alt="Foto usuari"
                         class="avatar">

                    <div>
                        <strong th:text="${usuariSessio.nom}">Nom Usuari</strong>
                        <p th:text="${usuariSessio.rol}">Rol</p>
                    </div>

                </a>

                <form th:action="@{/logout}" method="post">
                    <button class="logout-btn" type="submit">Tancar sessió</button>
                </form>

            </div>

        </aside>
    </body>
</html>
