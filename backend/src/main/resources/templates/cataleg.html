<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title>Catàleg</title>
        <link rel="stylesheet" th:href="@{/css/layout.css}">
        <link rel="stylesheet" th:href="@{/css/sidebar.css}">
        <link rel="stylesheet" th:href="@{/css/buttons.css}">
        <link rel="stylesheet" th:href="@{/css/table.css}">
        <link rel="stylesheet" th:href="@{/css/cataleg.css}">
    </head>
    <body>
        <div class="app-layout">

            <div th:replace="~{fragments/sidebar :: sidebar('cataleg')}"></div>

            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1>Catàleg</h1>
                        <p>Catàleg d'articles i productes</p>
                    </div>

                    <a th:href="@{/cataleg/materies-primeres/nova}" class="btn-primary">+ Afegir</a>
                </div>
                <div th:if="${error}" class="error-message">
                    <p th:text="${error}"></p>
                </div>

                <div th:if="${success}" class="success-message">
                    <p th:text="${success}"></p>
                </div>

                <div class="search-bar">
                    <input type="text" placeholder="Buscar...">
                </div>

                <div class="catalog-tabs">
                    <a th:href="@{/cataleg}" class="tab-btn active">Matèries primeres</a>
                    <a th:href="@{/productes-finals}" class="tab-btn">Productes finals</a>
                </div>

                <div class="content-card">
                    <table th:if="${not #lists.isEmpty(materiesPrimeres)}">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Descripció</th>
                                <th>Accions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="materia : ${materiesPrimeres}"th:classappend="${!materia.actiu} ? ' fila-inactiva' : ''">
                                <td th:text="${materia.id}"></td>
                                <td th:text="${materia.nom}"></td>
                                <td th:text="${materia.descripcio}"></td>
                                <td>
                                    <a th:if="${!materia.actiu}"
                                       th:href="@{'/cataleg/activar/' + ${materia.id}}"
                                       class="btn-primary">
                                        Activar
                                    </a>
                                    <a th:href="@{/cataleg/materies-primeres/editar/{id}(id=${materia.id})}" class="btn-edit">Editar</a>
                                    <a th:if="${materia.actiu}" th:href="@{/cataleg/materies-primeres/eliminar/{id}(id=${materia.id})}"
                                       class="btn-delete"
                                       onclick="return confirm('Segur que vols eliminar aquesta matèria primera?')">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div th:if="${#lists.isEmpty(materiesPrimeres)}" class="empty-state">
                        No hi ha matèries primeres registrades
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
