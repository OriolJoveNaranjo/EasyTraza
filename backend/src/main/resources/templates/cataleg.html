<!DOCTYPE html>

<html th:lang="${#locale.language}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title th:text="#{ui.cataleg}">Catàleg</title>
        <link rel="stylesheet" th:href="@{/css/layout.css}"/>
        <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>
        <link rel="stylesheet" th:href="@{/css/buttons.css}"/>
        <link rel="stylesheet" th:href="@{/css/table.css}"/>
        <link rel="stylesheet" th:href="@{/css/cataleg.css}"/>
    </head>
    <body>
        <div class="app-layout">
            <div th:replace="~{fragments/sidebar :: sidebar('cataleg')}"></div>
            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1 th:text="#{ui.cataleg}">Catàleg</h1>
                        <p th:text="#{ui.cataleg_d_articles_i_productes}">Catàleg d'articles i productes</p>
                    </div>
                    <a class="btn-primary" th:href="@{/cataleg/materies-primeres/nova}" th:text="#{ui.afegir}">+ Afegir</a>
                </div>
                <div class="error-message" th:if="${error}">
                    <p th:text="${error}"></p>
                </div>
                <div class="success-message" th:if="${success}">
                    <p th:text="${success}"></p>
                </div>
                <div class="search-bar">
                    <input placeholder="Buscar..." th:placeholder="#{ui.buscar}" type="text"/>
                </div>
                <div class="catalog-tabs">
                    <a class="tab-btn active" th:href="@{/cataleg}" th:text="#{ui.materies_primeres}">Matèries primeres</a>
                    <a class="tab-btn" th:href="@{/productes-finals}" th:text="#{ui.productes_finals}">Productes finals</a>
                </div>
                <div class="content-card">
                    <table th:if="${not #lists.isEmpty(materiesPrimeres)}">
                        <thead>
                            <tr>
                                <th th:text="#{ui.id}">ID</th>
                                <th th:text="#{ui.nom}">Nom</th>
                                <th th:text="#{ui.descripcio}">Descripció</th>
                                <th th:text="#{ui.accions}">Accions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:classappend="${!materia.actiu} ? ' fila-inactiva' : ''" th:each="materia : ${materiesPrimeres}">
                                <td th:text="${materia.id}"></td>
                                <td th:text="${materia.nom}"></td>
                                <td th:text="${materia.descripcio}"></td>
                                <td>
                                    <a class="btn-primary" th:href="@{'/cataleg/activar/' + ${materia.id}}" th:if="${!materia.actiu}" th:text="#{ui.activar}">Activar</a>
                                    <a class="btn-edit" th:href="@{/cataleg/materies-primeres/editar/{id}(id=${materia.id})}" th:text="#{ui.editar}">Editar</a>
                                    <a class="btn-delete" onclick="return confirm('Segur que vols eliminar aquesta matèria primera?')" th:href="@{/cataleg/materies-primeres/eliminar/{id}(id=${materia.id})}" th:if="${materia.actiu}" th:text="#{ui.eliminar}">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="empty-state" th:if="${#lists.isEmpty(materiesPrimeres)}" th:text="#{ui.no_hi_ha_materies_primeres_registrades}">No hi ha matèries primeres registrades</div>
                </div>
            </main>
        </div>
    </body>
</html>
