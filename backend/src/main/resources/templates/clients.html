<!DOCTYPE html>

<html th:lang="${#locale.language}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title th:text="#{ui.clients}">Clients</title>
        <link rel="stylesheet" th:href="@{/css/layout.css}"/>
        <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>
        <link rel="stylesheet" th:href="@{/css/buttons.css}"/>
        <link rel="stylesheet" th:href="@{/css/table.css}"/>
    </head>
    <body>
        <div class="app-layout">
            <div th:replace="~{fragments/sidebar :: sidebar('clients')}"></div>
            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1 th:text="#{ui.clients}">Clients</h1>
                        <p th:text="#{ui.gestio_de_clients}">Gestió de clients</p>
                    </div>
                    <a class="btn-primary" th:href="@{/clients/nou}" th:text="#{ui.nou_client}">+ Nou client</a>
                </div>
                <div class="error-message" th:if="${error}">
                    <p th:text="${error}"></p>
                </div>
                <div class="success-message" th:if="${success}">
                    <p th:text="${success}"></p>
                </div>
                <div class="filter-card">
                    <form class="filter-bar" method="get" th:action="@{/clients}">
                        <input class="filter-input" name="filtre" placeholder="Buscar per nom o NIF" th:placeholder="#{ui.buscar_per_nom_o_nif}" th:value="${filtre}" type="text"/>
                        <select class="filter-select" name="ordre">
                            <option th:text="#{ui.ordenar}" value="">-- Ordenar --</option>
                            <option th:selected="${ordre == 'nomAsc'}" th:text="#{ui.nom_2}" value="nomAsc">Nom ↑</option>
                            <option th:selected="${ordre == 'nomDesc'}" th:text="#{ui.nom_3}" value="nomDesc">Nom ↓</option>
                        </select>
                        <button class="btn-primary" th:text="#{ui.filtrar}" type="submit">Filtrar</button>
                        <a class="btn-secondary" th:href="@{/clients}" th:text="#{ui.reset}">Reset</a>
                    </form>
                </div>
                <div class="content-card">
                    <table th:if="${not #lists.isEmpty(clients)}">
                        <thead>
                            <tr>
                                <th th:text="#{ui.id}">ID</th>
                                <th th:text="#{ui.nif}">NIF</th>
                                <th th:text="#{ui.nom}">Nom</th>
                                <th th:text="#{ui.cognoms}">Cognoms</th>
                                <th th:text="#{ui.rgs}">RGS</th>
                                <th th:text="#{ui.accions}">Accions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:classappend="${!client.actiu} ? ' fila-inactiva' : ''" th:each="client : ${clients}">
                                <td th:text="${client.id}"></td>
                                <td th:text="${client.nif}"></td>
                                <td th:text="${client.nom}"></td>
                                <td th:text="${client.cognoms}"></td>
                                <td th:text="${client.registreSanitari}"></td>
                                <td>
                                    <a class="btn-primary" th:href="@{'/clients/activar/' + ${client.id}}" th:if="${!client.actiu}" th:text="#{ui.activar}">Activar</a>
                                    <a class="btn-view" th:href="@{'/clients/veure/' + ${client.id}}" th:text="#{ui.veure}">Veure</a>
                                    <a class="btn-edit" th:href="@{'/clients/editar/' + ${client.id}}" th:text="#{ui.editar}">Editar</a>
                                    <a class="btn-delete" onclick="return confirm('Segur que vols eliminar aquest client?')" th:href="@{'/clients/eliminar/' + ${client.id}}" th:if="${client.actiu}" th:text="#{ui.eliminar}">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="empty-state" th:if="${#lists.isEmpty(clients)}" th:text="#{ui.no_hi_ha_clients_registrats}">No hi ha clients registrats</div>
                </div>
            </main>
        </div>
    </body>
</html>
