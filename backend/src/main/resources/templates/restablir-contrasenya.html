<!DOCTYPE html>

<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <title th:text="#{ui.restablir_contrasenya_easytraza}">Restablir contrasenya - EasyTraza</title>
        <link rel="stylesheet" th:href="@{/css/layout.css}"/>
        <link rel="stylesheet" th:href="@{/css/login.css}"/>
    </head>
    <body class="login-body">
        <main class="login-container">
            <div class="login-logo">
                <img alt="EasyTraza" th:src="@{/images/LogoEasyTraza.PNG}"/>
            </div>
            <section class="login-card">
                <h2 class="login-title" th:text="#{ui.nova_contrasenya}">Nova contrasenya</h2>
                <form method="post" th:action="@{/restablir-contrasenya}">
                    <input name="token" th:value="${token}" type="hidden"/>
                    <label class="login-label" for="novaContrasenya" th:text="#{ui.nova_contrasenya}">Nova contrasenya</label>
                    <input class="login-input" id="novaContrasenya" name="novaContrasenya" placeholder="Nova contrasenya" required="" th:placeholder="#{ui.nova_contrasenya}" type="password"/>
                    <button class="login-button" th:text="#{ui.actualitzar_contrasenya}" type="submit">Actualitzar contrasenya</button>
                </form>
                <div class="login-footer">
                    <a th:href="@{/login}" th:text="#{ui.tornar_al_login}">Tornar al login</a>
                </div>
            </section>
        </main>
    </body>
</html>
