<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Recuperar contrasenya - EasyTraza</title>

        <link rel="stylesheet" th:href="@{/css/layout.css}">
        <link rel="stylesheet" th:href="@{/css/login.css}">
    </head>

    <body class="login-body">

        <main class="login-container">

            <div class="login-logo">
                <img th:src="@{/images/LogoEasyTraza.PNG}" alt="EasyTraza">
            </div>

            <section class="login-card">

                <h2 class="login-title">Recuperar contrasenya</h2>

                <div th:if="${error}" class="login-alert error" th:text="${error}"></div>

                <div th:if="${success}" class="login-alert success" th:text="${success}"></div>

                <form th:action="@{/recuperar-contrasenya}" method="post">

                    <label class="login-label" for="email">Email</label>
                    <input id="email"
                           class="login-input"
                           type="email"
                           name="email"
                           placeholder="correu@exemple.com"
                           required>

                    <button class="login-button" type="submit">
                        Enviar enllaç de recuperació
                    </button>

                </form>

                <div class="login-footer">
                    <a th:href="@{/login}">Tornar al login</a>
                </div>

            </section>

        </main>

    </body>
</html>
