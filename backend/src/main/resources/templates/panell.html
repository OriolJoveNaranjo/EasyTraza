<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Panell - EasyTraza</title>

        <link rel="stylesheet" th:href="@{/css/layout.css}">
        <link rel="stylesheet" th:href="@{/css/sidebar.css}">
        <link rel="stylesheet" th:href="@{/css/buttons.css}">
        <link rel="stylesheet" th:href="@{/css/table.css}">
    </head>

    <body>

        <div class="app-layout">

            <div th:replace="~{fragments/sidebar :: sidebar('panell')}"></div>

            <main class="page-content">

                <div class="page-header">
                    <div>
                        <h1>Panell</h1>
                        <p>Activitat recent</p>
                        <p>Pulsa qualsevol per navegar a la pàgina</p>
                    </div>
                </div>

                <div class="dashboard-cards">

                    <a th:href="@{/lots-proveidor(estat='OBERT')}" class="dashboard-card dashboard-link">
                        <h2>Lots actius</h2>
                        <strong th:text="${lotsActius}">0</strong>
                        <p> Veure tots </p>
                    </a>

                    <a th:href="@{/panell/caducitats}" class="dashboard-card dashboard-link">
                        <h2>Avís de caducitat</h2>
                        <strong th:text="${alertesCaducitat}">0</strong>
                        <p>Hi ha productes propers a caducar</p>
                    </a>

                    <a th:href="@{/controls}" class="dashboard-card dashboard-link">
                        <h2>Controls pendents</h2>
                        <strong th:text="${controlsPendents}">0</strong>
                        <p th:text="${controlsPendents > 0 ? 'Control pH pendent' : 'Controls al dia'}"></p>
                    </a>

                </div>

            </main>

        </div>

    </body>
</html>
