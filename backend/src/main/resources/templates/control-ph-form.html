<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Registrar pH</title>
        <link rel="stylesheet" th:href="@{/css/forms.css}">
        <link rel="stylesheet" th:href="@{/css/buttons.css}">
    </head>

    <body>
        <div class="standalone-form-page">
            <div class="form-card">

                <h1>Registrar pH</h1>
                <p>Registra el control de pH de l'aigua</p>

                <form th:action="@{/controls/guardar}"
                      th:object="${controlPh}"
                      method="post">

                    <div class="field">
                        <label>Valor de pH *</label>
                        <input type="number"
                               th:field="*{valorPh}"
                               step="0.1"
                               min="0"
                               max="14"
                               required>
                    </div>

                    <div class="field">
                        <label>Observacions</label>
                        <textarea th:field="*{observacions}"
                                  rows="4"
                                  maxlength="500"
                                  placeholder="Escriu una observació si cal..."></textarea>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/controls}" class="btn-secondary">
                            Cancel·lar
                        </a>

                        <button type="submit" class="btn-primary">
                            Guardar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </body>
</html>
