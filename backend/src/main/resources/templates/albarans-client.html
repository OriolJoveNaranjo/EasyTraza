<!DOCTYPE html>

<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title th:text="#{ui.albarans_client}">Albarans Client</title>
        <link rel="stylesheet" th:href="@{/css/layout.css}"/>
        <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>
        <link rel="stylesheet" th:href="@{/css/buttons.css}"/>
        <link rel="stylesheet" th:href="@{/css/table.css}"/>
    </head>
    <body>
        <div class="app-layout">
            <div th:replace="~{fragments/sidebar :: sidebar('albarans-client')}"></div>
            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1 th:text="#{ui.albarans_de_client}">Albarans de Client</h1>
                        <p th:text="#{ui.consulta_i_gestiona_els_albarans_de_lliurament_a_c}">Consulta i gestiona els albarans de lliurament a clients.</p>
                    </div>
                    <a class="btn-primary" th:href="@{/albarans-client/nou}" th:text="#{ui.nou_albara}">+ Nou albarà</a>
                </div>
                <div class="filter-card">
                    <form class="filter-bar" method="get" th:action="@{/albarans-client}">
                        <select class="filter-select" name="clientId">
                            <option th:text="#{ui.client}" value="">-- Client --</option>
                            <option th:each="c : ${clients}" th:selected="${clientId != null and clientId == c.id}" th:text="${c.nom}" th:value="${c.id}">
                            </option>
                        </select>
                        <select class="filter-select" name="estat">
                            <option th:text="#{ui.estat}" value="">-- Estat --</option>
                            <option th:selected="${estatSeleccionat == 'PENDENT'}" th:text="#{ui.pendent}" value="PENDENT">Pendent</option>
                            <option th:selected="${estatSeleccionat == 'LLIURAT'}" th:text="#{ui.lliurat}" value="LLIURAT">Lliurat</option>
                        </select>
                        <select class="filter-select" name="ordre">
                            <option th:text="#{ui.ordenar}" value="">-- Ordenar --</option>
                            <option th:selected="${ordre == 'dataAsc'}" th:text="#{ui.data}" value="dataAsc">Data ↑</option>
                            <option th:selected="${ordre == 'dataDesc'}" th:text="#{ui.data_2}" value="dataDesc">Data ↓</option>
                        </select>
                        <button class="btn-primary" th:text="#{ui.filtrar}" type="submit">Filtrar</button>
                        <a class="btn-secondary" th:href="@{/albarans-client}" th:text="#{ui.reset}">Reset</a>
                    </form>
                </div>
                <div class="content-card">
                    <table class="data-table" th:if="${albarans != null and !albarans.isEmpty()}">
                        <thead>
                            <tr>
                                <th th:text="#{ui.id}">ID</th>
                                <th th:text="#{ui.data_3}">Data</th>
                                <th th:text="#{ui.client_2}">Client</th>
                                <th th:text="#{ui.estat_2}">Estat</th>
                                <th th:text="#{ui.accions}">Accions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${albarans}">
                                <td th:text="${a.id}"></td>
                                <td th:text="${a.data != null ? #temporals.format(a.data, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                                <td th:text="${a.client != null ? a.client.nom : '-'}"></td>
                                <td>
                                    <span th:class="${a.estat != null and a.estat.name() == 'LLIURAT'} ? 'status-badge status-success' : 'status-badge status-warning'" th:text="${a.estat}">
                                    </span>
                                </td>
                                <td class="actions-cell">
                                    <a class="btn-view" th:href="@{'/albarans-client/veure/' + ${a.id}}" th:text="#{ui.veure}">Veure</a>
                                    <a class="btn-edit" th:href="@{'/albarans-client/editar/' + ${a.id}}" th:if="${a.estat == null or a.estat.name() == 'PENDENT'}" th:text="#{ui.editar}">Editar</a>
                                    <a class="btn-primary" th:href="@{'/albarans-client/lliurar/' + ${a.id}}" th:if="${a.estat != null and a.estat.name() == 'PENDENT'}" th:text="#{ui.marcar_lliurat}">Marcar lliurat</a>
                                    <a class="btn-delete" onclick="return confirm('Segur que vols eliminar aquest albarà?')" th:href="@{'/albarans-client/eliminar/' + ${a.id}}" th:if="${a.estat == null or a.estat.name() == 'PENDENT'}" th:text="#{ui.eliminar}">Eliminar</a>
                                    <span th:if="${a.estat != null and a.estat.name() == 'LLIURAT'}" th:text="#{ui.bloquejat}">Bloquejat</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="empty-state" th:if="${albarans == null or albarans.isEmpty()}">
                        <h2 th:text="#{ui.no_hi_ha_resultats}">No hi ha resultats</h2>
                        <p th:text="#{ui.no_hi_ha_cap_albara_de_client_amb_els_filtres_apli}">No hi ha cap albarà de client amb els filtres aplicats.</p>
                        <a class="btn-primary" th:href="@{/albarans-client/nou}" th:text="#{ui.crear_primer_albara}">Crear primer albarà</a>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
