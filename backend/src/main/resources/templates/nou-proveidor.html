<!DOCTYPE html>

<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title th:text="#{ui.proveidor_2}">Proveïdor</title>
        <link rel="stylesheet" th:href="@{/css/forms.css}"/>
        <link rel="stylesheet" th:href="@{/css/buttons.css}"/>
    </head>
    <body>
        <div class="standalone-form-page">
            <div class="form-card">
                <h1 th:text="${mode == 'view'} ? 'Veure proveïdor' : (${proveidor.id != null} ? 'Editar proveïdor' : 'Afegir proveïdor')"></h1>
                <p class="form-subtitle" th:text="#{ui.informacio_del_proveidor}">Informació del proveïdor</p>
                <p class="error-message" th:if="${error}" th:text="${error}"></p>
                <form method="post" th:action="@{/proveidors/guardar}" th:if="${mode != 'view'}" th:object="${proveidor}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input th:field="*{id}" type="hidden"/>
                    <div class="field">
                        <label th:text="#{ui.nom_4}">Nom *</label>
                        <input required="" th:field="*{nom}" type="text"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.nif_cif}">NIF/CIF *</label>
                        <input maxlength="9" pattern="([A-HJNP-SUVW][0-9]{7}[0-9A-J])|([0-9]{8}[A-Z])|([XYZ][0-9]{7}[A-Z])" required="" th:field="*{cif}" title="Introdueix un NIF, CIF o NIE vàlid. Exemple: 47183180Z o B12345678" type="text"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.telefon}">Telèfon</label>
                        <input th:field="*{telefon}" type="text"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.email}">Email</label>
                        <input th:field="*{email}" type="email"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.adreca}">Adreça</label>
                        <input th:field="*{adreca}" type="text"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.observacions}">Observacions</label>
                        <textarea th:field="*{observacions}"></textarea>
                    </div>
                    <div class="form-actions">
                        <a class="btn-secondary" th:href="@{/proveidors}" th:text="#{ui.cancellar}">Cancel·lar</a>
                        <button class="btn-primary" th:text="#{ui.guardar}" type="submit">Guardar</button>
                    </div>
                </form>
                <div th:if="${mode == 'view'}">
                    <div class="field">
                        <label th:text="#{ui.nom}">Nom</label>
                        <input readonly="" th:value="${proveidor.nom}" type="text"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.cif}">CIF</label>
                        <input readonly="" th:value="${proveidor.cif}" type="text"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.telefon}">Telèfon</label>
                        <input readonly="" th:value="${proveidor.telefon}" type="text"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.email}">Email</label>
                        <input readonly="" th:value="${proveidor.email}" type="text"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.adreca}">Adreça</label>
                        <input readonly="" th:value="${proveidor.adreca}" type="text"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.observacions}">Observacions</label>
                        <textarea readonly="" th:text="${proveidor.observacions}"></textarea>
                    </div>
                    <div class="form-actions">
                        <a class="btn-secondary" th:href="@{/proveidors}" th:text="#{ui.tornar}">Tornar</a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
