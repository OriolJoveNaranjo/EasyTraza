<!DOCTYPE html>

<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title th:text="#{ui.albara_de_client}">Albarà de client</title>
        <link rel="stylesheet" th:href="@{/css/forms.css}"/>
        <link rel="stylesheet" th:href="@{/css/buttons.css}"/>
        <style>
            .linies-box {
                margin-top: 24px;
                padding-top: 12px;
                border-top: 1px solid #ddd;
            }

            .linia-card {
                margin-bottom: 18px;
                padding: 16px;
                border: 1px solid #ddd;
                border-radius: 10px;
                background: #fafafa;
            }

            .linia-card h3 {
                margin-top: 0;
                margin-bottom: 12px;
            }

            .inline-actions {
                display: flex;
                gap: 10px;
                margin-top: 12px;
            }

            .readonly-value {
                display: block;
                padding: 10px 12px;
                background: #f5f5f5;
                border: 1px solid #ddd;
                border-radius: 8px;
                min-height: 20px;
            }
            .lots-checkbox-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 10px;
                background: #fff;
            }

            .lot-check {
                display: flex;
                gap: 8px;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <div class="standalone-form-page">
            <div class="form-card">
                <h1 th:text="${mode == 'view'} 
                    ? 'Veure albarà de client' 
                    : (${albaraClient.id != null} ? 'Editar albarà de client' : 'Nou albarà de client')">
                </h1>
                <p class="error-message" th:if="${error}" th:text="${error}"></p>
                <form method="post" th:action="@{/albarans-client/guardar}" th:object="${albaraClient}">
                    <input th:field="*{id}" type="hidden"/>
                    <div class="field">
                        <label th:text="#{ui.client_3}">Client *</label>
                        <select required="" th:disabled="${mode == 'view'}" th:field="*{client.id}">
                            <option th:text="#{ui.selecciona_client}" value="">-- Selecciona client --</option>
                            <option th:each="client : ${clients}" th:text="${client.nom}" th:value="${client.id}">
                            </option>
                        </select>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.data_4}">Data *</label>
                        <input name="data" required="" th:disabled="${mode == 'view'}" th:value="${albaraClient.data != null ? #temporals.format(albaraClient.data, 'yyyy-MM-dd''T''HH:mm') : ''}" type="datetime-local"/>
                    </div>
                    <div class="field">
                        <label th:text="#{ui.estat_2}">Estat</label>
                        <span class="readonly-value" th:text="${albaraClient.estat}"></span>
                        <input th:field="*{estat}" type="hidden"/>
                    </div>
                    <div class="linies-box">
                        <h2 th:text="#{ui.productes}">Productes</h2>
                        <div id="liniesContainer">
                            <div class="linia-card" th:each="linia, stat : *{linies}">
                                <h3 th:text="'Producte ' + ${stat.index + 1}"></h3>
                                <input th:field="*{linies[__${stat.index}__].id}" type="hidden">
                                <div class="field">
                                    <label th:text="#{ui.producte}">Producte *</label>
                                    <select required="" th:disabled="${mode == 'view'}" th:field="*{linies[__${stat.index}__].producte.id}">
                                        <option th:text="#{ui.selecciona_producte}" value="">-- Selecciona producte --</option>
                                        <option th:each="producte : ${productes}" th:text="${producte.nom}" th:value="${producte.id}">
                                        </option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label th:text="#{ui.quantitat_2}">Quantitat *</label>
                                    <input min="0.01" required="" step="0.01" th:disabled="${mode == 'view'}" th:field="*{linies[__${stat.index}__].quantitat}" type="number"/>
                                </div>
                                <div class="linies-box" th:if="${mode == 'view'}">
                                    <h2 th:text="#{ui.lots_associats_a_aquest_albara}">Lots associats a aquest albarà</h2>
                                    <table class="data-table" th:if="${tracabilitats != null and !tracabilitats.isEmpty()}">
                                        <thead>
                                            <tr>
                                                <th th:text="#{ui.lot_2}">Lot</th>
                                                <th th:text="#{ui.materia_primera}">Matèria primera</th>
                                                <th th:text="#{ui.estat_actual_del_lot}">Estat actual del lot</th>
                                                <th th:text="#{ui.data_registre}">Data registre</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="t : ${tracabilitats}">
                                                <td th:text="${t.lotProveidor.identificadorLot}"></td>
                                                <td th:text="${t.lotProveidor.materiaPrimera.nom}"></td>
                                                <td th:text="${t.lotProveidor.estat}"></td>
                                                <td th:text="${t.dataRegistre != null ? #temporals.format(t.dataRegistre, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="inline-actions">
                                    <button class="btn-secondary" onclick="eliminarLinia(this)" th:if="${mode != 'view'}" th:text="#{ui.eliminar_producte}" type="button">Eliminar producte</button>
                                </div>
                                </input></div>
                        </div>
                        <div class="inline-actions">
                            <button class="btn-primary" onclick="afegirLinia()" th:if="${mode != 'view'}" th:text="#{ui.afegir_producte}" type="button">+ Afegir producte</button>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn-secondary" th:href="@{/albarans-client}" th:text="${mode == 'view'} ? 'Tornar' : 'Cancel·lar'">
                        </a>
                        <button class="btn-primary" th:if="${mode != 'view'}" th:text="#{ui.guardar}" type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
        <template id="liniaTemplate">
            <div class="linia-card">
                <h3 th:text="#{ui.producte_index_visual}">Producte __INDEX_VISUAL__</h3>
                <input name="linies[__INDEX__].id" type="hidden">
                <div class="field">
                    <label th:text="#{ui.producte}">Producte *</label>
                    <select name="linies[__INDEX__].producte.id" required="">
                        <option th:text="#{ui.selecciona_producte}" value="">-- Selecciona producte --</option>
                        <option th:each="producte : ${productes}" th:text="${producte.nom}" th:value="${producte.id}">
                        </option>
                    </select>
                </div>
                <div class="field">
                    <label th:text="#{ui.quantitat_2}">Quantitat *</label>
                    <input min="0.01" name="linies[__INDEX__].quantitat" required="" step="0.01" type="number"/>
                </div>
                <div class="inline-actions">
                    <button class="btn-secondary" onclick="eliminarLinia(this)" th:text="#{ui.eliminar_producte}" type="button">Eliminar producte</button>
                </div>
                </input></div>
        </template>
        <script>
            function afegirLinia() {
                const container = document.getElementById('liniesContainer');
                const template = document.getElementById('liniaTemplate').innerHTML;
                const index = container.querySelectorAll('.linia-card').length;

                let html = template
                        .replaceAll('__INDEX__', index)
                        .replaceAll('__INDEX_VISUAL__', index + 1);

                container.insertAdjacentHTML('beforeend', html);
            }

            function eliminarLinia(button) {
                const container = document.getElementById('liniesContainer');
                const targetCard = button.closest('.linia-card');

                if (container.querySelectorAll('.linia-card').length === 1) {
                    alert('L\'albarà ha de tenir almenys un producte.');
                    return;
                }

                targetCard.remove();
                reindexarLinies();
            }

            function reindexarLinies() {
                const cards = document.querySelectorAll('#liniesContainer .linia-card');

                cards.forEach((card, index) => {
                    card.querySelector('h3').textContent = 'Producte ' + (index + 1);

                    const elements = card.querySelectorAll('input, select');

                    elements.forEach(el => {
                        if (el.name) {
                            el.name = el.name.replace(/linies\[\d+\]/g, 'linies[' + index + ']');
                        }
                    });
                });
            }

        </script>
    </body>
</html>
