<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Albarà de client</title>
        <link rel="stylesheet" th:href="@{/css/forms.css}">
        <link rel="stylesheet" th:href="@{/css/buttons.css}">

        <style>
            .linies-box {
                margin-top: 24px;
                padding-top: 12px;
                border-top: 1px solid #ddd;
            }

            .linia-card {
                margin-bottom: 18px;
                padding: 16px;
                border: 1px solid #ddd;
                border-radius: 10px;
                background: #fafafa;
            }

            .linia-card h3 {
                margin-top: 0;
                margin-bottom: 12px;
            }

            .inline-actions {
                display: flex;
                gap: 10px;
                margin-top: 12px;
            }

            .readonly-value {
                display: block;
                padding: 10px 12px;
                background: #f5f5f5;
                border: 1px solid #ddd;
                border-radius: 8px;
                min-height: 20px;
            }
        </style>
    </head>

    <body>
        <div class="standalone-form-page">
            <div class="form-card">

                <h1 th:text="${mode == 'view'} 
                    ? 'Veure albarà de client' 
                    : (${albaraClient.id != null} ? 'Editar albarà de client' : 'Nou albarà de client')">
                </h1>

                <p th:if="${error}" th:text="${error}" class="error-message"></p>

                <form th:action="@{/albarans-client/guardar}"
                      th:object="${albaraClient}"
                      method="post">

                    <input type="hidden" th:field="*{id}"/>

                    <div class="field">
                        <label>Client *</label>
                        <select th:field="*{client.id}" required th:disabled="${mode == 'view'}">
                            <option value="">-- Selecciona client --</option>
                            <option th:each="client : ${clients}"
                                    th:value="${client.id}"
                                    th:text="${client.nom}">

                            </option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Data *</label>
                        <input type="datetime-local"
                               name="data"
                               th:value="${albaraClient.data != null ? #temporals.format(albaraClient.data, 'yyyy-MM-dd''T''HH:mm') : ''}"
                               th:disabled="${mode == 'view'}"
                               required>
                    </div>

                    <div class="field">
                        <label>Estat</label>
                        <span class="readonly-value" th:text="${albaraClient.estat}"></span>
                        <input type="hidden" th:field="*{estat}">
                    </div>

                    <div class="linies-box">
                        <h2>Productes</h2>

                        <div id="liniesContainer">
                            <div class="linia-card" th:each="linia, stat : *{linies}">
                                <h3 th:text="'Producte ' + ${stat.index + 1}"></h3>

                                <input type="hidden" th:field="*{linies[__${stat.index}__].id}"/>

                                <div class="field">
                                    <label>Producte *</label>
                                    <select th:field="*{linies[__${stat.index}__].producte.id}" required th:disabled="${mode == 'view'}">
                                        <option value="">-- Selecciona producte --</option>
                                        <option th:each="producte : ${productes}"
                                                th:value="${producte.id}"
                                                th:text="${producte.nom}">
                                        </option>
                                    </select>
                                </div>

                                <div class="field">
                                    <label>Quantitat *</label>
                                    <input type="number"
                                           step="0.01"
                                           min="0.01"
                                           th:field="*{linies[__${stat.index}__].quantitat}"
                                           th:disabled="${mode == 'view'}" 
                                           required>
                                </div>

                                <div class="inline-actions">
                                    <button type="button" class="btn-secondary" onclick="eliminarLinia(this)" th:if="${mode != 'view'}">
                                        Eliminar producte
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="inline-actions">
                            <button type="button" class="btn-primary" onclick="afegirLinia()" th:if="${mode != 'view'}">
                                + Afegir producte
                            </button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/albarans-client}" class="btn-secondary"
                           th:text="${mode == 'view'} ? 'Tornar' : 'Cancel·lar'">
                        </a>

                        <button type="submit" class="btn-primary" th:if="${mode != 'view'}">
                            Guardar
                        </button>
                    </div>
                </form>

            </div>
        </div>

        <template id="liniaTemplate">
            <div class="linia-card">
                <h3>Producte __INDEX_VISUAL__</h3>

                <input type="hidden" name="linies[__INDEX__].id"/>

                <div class="field">
                    <label>Producte *</label>
                    <select name="linies[__INDEX__].producte.id" required>
                        <option value="">-- Selecciona producte --</option>
                        <option th:each="producte : ${productes}"
                                th:value="${producte.id}"
                                th:text="${producte.nom}">
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label>Quantitat *</label>
                    <input type="number"
                           step="0.01"
                           min="0.01"
                           name="linies[__INDEX__].quantitat"
                           required>
                </div>

                <div class="inline-actions">
                    <button type="button" class="btn-secondary" onclick="eliminarLinia(this)">
                        Eliminar producte
                    </button>
                </div>
            </div>
        </template>

        <script>
            function afegirLinia() {
                const container = document.getElementById('liniesContainer');
                const template = document.getElementById('liniaTemplate').innerHTML;
                const index = container.querySelectorAll('.linia-card').length;

                let html = template
                        .replaceAll('__INDEX__', index)
                        .replaceAll('__INDEX_VISUAL__', index + 1);

                container.insertAdjacentHTML('beforeend', html);
            }

            function eliminarLinia(button) {
                const container = document.getElementById('liniesContainer');
                const targetCard = button.closest('.linia-card');

                if (container.querySelectorAll('.linia-card').length === 1) {
                    alert('L\'albarà ha de tenir almenys un producte.');
                    return;
                }

                targetCard.remove();
                reindexarLinies();
            }

            function reindexarLinies() {
                const cards = document.querySelectorAll('#liniesContainer .linia-card');

                cards.forEach((card, index) => {
                    card.querySelector('h3').textContent = 'Producte ' + (index + 1);

                    const elements = card.querySelectorAll('input, select');

                    elements.forEach(el => {
                        if (el.name) {
                            el.name = el.name.replace(/linies\[\d+\]/g, 'linies[' + index + ']');
                        }
                    });
                });
            }
        </script>
    </body>
</html>
