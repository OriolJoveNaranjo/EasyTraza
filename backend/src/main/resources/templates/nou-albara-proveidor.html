<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Albarà de proveïdor</title>
        <link rel="stylesheet" th:href="@{/css/forms.css}">
        <link rel="stylesheet" th:href="@{/css/buttons.css}">
        <style>
            .linies-box {
                margin-top: 24px;
                padding-top: 12px;
                border-top: 1px solid #ddd;
            }

            .linia-card {
                margin-bottom: 18px;
                padding: 16px;
                border: 1px solid #ddd;
                border-radius: 10px;
                background: #fafafa;
            }

            .linia-card h3 {
                margin-top: 0;
                margin-bottom: 12px;
            }

            .readonly-value {
                display: block;
                padding: 10px 12px;
                background: #f5f5f5;
                border: 1px solid #ddd;
                border-radius: 8px;
                min-height: 20px;
            }

            .inline-actions {
                display: flex;
                gap: 10px;
                margin-top: 12px;
            }
        </style>
    </head>
    <body>
        <div class="standalone-form-page">
            <div class="form-card">

                <h1 th:text="${mode == 'view'} 
                    ? 'Veure albarà de proveïdor' 
                    : (${albaraProveidor.id != null} ? 'Editar albarà de proveïdor' : 'Nou albarà de proveïdor')">
                </h1>

                <p th:if="${error}" th:text="${error}" class="error-message"></p>

                <!-- MODO EDITAR / CREAR -->
                <form th:if="${mode != 'view'}"
                      th:action="@{/albarans-proveidor/guardar}"
                      th:object="${albaraProveidor}"
                      method="post">

                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" name="formSource" value="manual">

                    <div class="field">
                        <label>Data recepció *</label>
                        <input type="date"
                               name="dataRecepcio"
                               th:value="${albaraProveidor.dataRecepcio != null ? #temporals.format(albaraProveidor.dataRecepcio, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>

                    <div class="field">
                        <label>Proveïdor *</label>
                        <select th:field="*{proveidor.id}" required>
                            <option value="">-- Selecciona proveïdor --</option>
                            <option th:each="proveidor : ${proveidors}"
                                    th:value="${proveidor.id}"
                                    th:text="${proveidor.nom}">
                            </option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Número d'albarà</label>
                        <input type="text"
                               name="numeroAlbara"
                               th:value="${albaraProveidor.numeroAlbara != null ? albaraProveidor.numeroAlbara : ''}">
                    </div>

                    <div class="linies-box">
                        <h2>Lots</h2>

                        <div id="liniesContainer">
                            <div class="linia-card" th:each="linia, stat : *{linies}">
                                <h3 th:text="'Lot ' + ${stat.index + 1}"></h3>

                                <input type="hidden" th:field="*{linies[__${stat.index}__].id}" />

                                <div class="field">
                                    <label>Matèria primera</label>
                                    <select th:field="*{linies[__${stat.index}__].materiaPrimera.id}">
                                        <option value="">-- Selecciona matèria primera --</option>
                                        <option th:each="materia : ${materiesPrimeres}"
                                                th:value="${materia.id}"
                                                th:text="${materia.nom}">
                                        </option>
                                    </select>
                                </div>

                                <div class="field">
                                    <label>Quantitat</label>
                                    <input type="number"
                                           step="0.01"
                                           min="0"
                                           th:field="*{linies[__${stat.index}__].quantitat}">
                                </div>

                                <div class="field">
                                    <label>Unitat</label>
                                    <input type="text"
                                           th:field="*{linies[__${stat.index}__].unitat}">
                                </div>

                                <div class="field">
                                    <label>Identificador lot</label>
                                    <input type="text"
                                           th:field="*{linies[__${stat.index}__].lot.identificadorLot}">
                                </div>

                                <div class="field">
                                    <label>Data caducitat</label>
                                    <input type="date"
                                           th:name="'linies[' + ${stat.index} + '].lot.dataCaducitat'"
                                           th:value="${linia.lot != null && linia.lot.dataCaducitat != null ? #temporals.format(linia.lot.dataCaducitat, 'yyyy-MM-dd') : ''}">
                                </div>

                                <div class="inline-actions">
                                    <button type="button" class="btn-secondary" onclick="eliminarLinia(this)">
                                        Eliminar lot
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="inline-actions">
                            <button type="button" class="btn-primary" onclick="afegirLinia()">
                                + Afegir lot
                            </button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/albarans-proveidor}" class="btn-secondary">Cancel·lar</a>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>

                <!-- MODO VER -->
                <div th:if="${mode == 'view'}">
                    <div class="field">
                        <label>ID</label>
                        <span class="readonly-value" th:text="${albaraProveidor.id}"></span>
                    </div>

                    <div class="field">
                        <label>Data recepció</label>
                        <span class="readonly-value" th:text="${albaraProveidor.dataRecepcio}"></span>
                    </div>

                    <div class="field">
                        <label>Proveïdor</label>
                        <span class="readonly-value"
                              th:text="${albaraProveidor.proveidor != null ? albaraProveidor.proveidor.nom : ''}">
                        </span>
                    </div>
                    
                    <div class="field">
                        <label>Número d'albarà</label>
                        <span class="readonly-value"
                              th:text="${albaraProveidor.numeroAlbara != null ? albaraProveidor.numeroAlbara : ''}">
                        </span>
                    </div>

                    <div class="linies-box">
                        <h2>Lots</h2>

                        <div class="linia-card" th:each="linia, stat : ${albaraProveidor.linies}">
                            <h3 th:text="'Lot ' + ${stat.index + 1}"></h3>

                            <div class="field">
                                <label>Matèria primera</label>
                                <span class="readonly-value"
                                      th:text="${linia.materiaPrimera != null ? linia.materiaPrimera.nom : ''}">
                                </span>
                            </div>

                            <div class="field">
                                <label>Quantitat</label>
                                <span class="readonly-value" th:text="${linia.quantitat}"></span>
                            </div>

                            <div class="field">
                                <label>Unitat</label>
                                <span class="readonly-value" th:text="${linia.unitat}"></span>
                            </div>

                            <div class="field">
                                <label>Identificador lot</label>
                                <span class="readonly-value"
                                      th:text="${linia.lot != null ? linia.lot.identificadorLot : ''}">
                                </span>
                            </div>

                            <div class="field">
                                <label>Data caducitat</label>
                                <span class="readonly-value"
                                      th:text="${linia.lot != null ? linia.lot.dataCaducitat : ''}">
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/albarans-proveidor}" class="btn-secondary">Tornar</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- SOLO se usa en create/edit -->
        <template id="liniaTemplate" th:if="${mode != 'view'}">
            <div class="linia-card">
                <h3>Lot __INDEX_VISUAL__</h3>

                <input type="hidden" name="linies[__INDEX__].id" />

                <div class="field">
                    <label>Matèria primera</label>
                    <select name="linies[__INDEX__].materiaPrimera.id">
                        <option value="">-- Selecciona matèria primera --</option>
                        <option th:each="materia : ${materiesPrimeres}"
                                th:value="${materia.id}"
                                th:text="${materia.nom}">
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label>Quantitat</label>
                    <input type="number" step="0.01" min="0" name="linies[__INDEX__].quantitat">
                </div>

                <div class="field">
                    <label>Unitat</label>
                    <input type="text" name="linies[__INDEX__].unitat">
                </div>

                <div class="field">
                    <label>Identificador lot</label>
                    <input type="text" name="linies[__INDEX__].lot.identificadorLot">
                </div>

                <div class="field">
                    <label>Data caducitat</label>
                    <input type="date" name="linies[__INDEX__].lot.dataCaducitat">
                </div>

                <div class="inline-actions">
                    <button type="button" class="btn-secondary" onclick="eliminarLinia(this)">
                        Eliminar lot
                    </button>
                </div>
            </div>
        </template>

        <script th:if="${mode != 'view'}">
            function afegirLinia() {
                const container = document.getElementById('liniesContainer');
                const template = document.getElementById('liniaTemplate').innerHTML;
                const index = container.querySelectorAll('.linia-card').length;

                let html = template
                        .replaceAll('__INDEX__', index)
                        .replaceAll('__INDEX_VISUAL__', index + 1);

                container.insertAdjacentHTML('beforeend', html);
            }

            function eliminarLinia(button) {
                const container = document.getElementById('liniesContainer');
                const targetCard = button.closest('.linia-card');

                if (container.querySelectorAll('.linia-card').length === 1) {
                    alert('L\'albarà ha de tenir almenys un lot.');
                    return;
                }

                targetCard.remove();
                reindexarLinies();
            }

            function reindexarLinies() {
                const cards = document.querySelectorAll('#liniesContainer .linia-card');

                cards.forEach((card, index) => {
                    const title = card.querySelector('h3');
                    title.textContent = 'Lot ' + (index + 1);

                    const elements = card.querySelectorAll('input, select, textarea');

                    elements.forEach(el => {
                        if (el.name) {
                            el.name = el.name.replace(/linies\[\d+\]/g, 'linies[' + index + ']');
                        }
                    });
                });
            }
        </script>
    </body>
</html>
