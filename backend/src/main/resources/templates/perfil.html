<!DOCTYPE html>

<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <title th:text="#{ui.perfil_easytraza}">Perfil - EasyTraza</title>
        <link rel="stylesheet" th:href="@{/css/layout.css}"/>
        <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>
        <link rel="stylesheet" th:href="@{/css/buttons.css}"/>
        <link rel="stylesheet" th:href="@{/css/perfil.css}"/>
    </head>
    <body>
        <div class="app-layout">
            <div th:replace="~{fragments/sidebar :: sidebar('perfil')}"></div>
            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1 th:text="#{ui.el_meu_perfil}">El meu perfil</h1>
                        <p th:text="#{ui.edita_les_teves_dades_personals}">Edita les teves dades personals</p>
                    </div>
                </div>
                <div class="profile-success" th:if="${param.success}" th:text="#{ui.perfil_actualitzat_correctament}">Perfil actualitzat correctament.</div>
                <form class="profile-card" enctype="multipart/form-data" id="perfilForm" method="post" th:action="@{/perfil}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="profile-photo-section">
                        <img alt="Foto de perfil" class="profile-photo" id="previewFoto" th:src="${usuari.foto != null and !#strings.isEmpty(usuari.foto)}
                             ? @{${'/uploads/usuaris/' + usuari.foto}}
                             : @{/images/usuaris/fotoPerfil.png}"/>
                        <label class="photo-button" for="foto" th:text="#{ui.canviar_foto}">Canviar foto</label>
                        <input accept="image/*" hidden="" id="foto" name="foto" type="file"/>
                    </div>
                    <div class="profile-fields">
                        <div class="form-group">
                            <label th:text="#{ui.nom}">Nom</label>
                            <input name="nom" required="" th:value="${usuari.nom}" type="text"/>
                        </div>
                        <div class="form-group">
                            <label th:text="#{ui.email}">Email</label>
                            <input class="readonly-input" readonly="" th:value="${usuari.email}" type="email"/>
                        </div>
                        <div class="form-group">
                            <label th:text="#{ui.rol_2}">Rol</label>
                            <input class="readonly-input" readonly="" th:value="${usuari.rol}" type="text"/>
                        </div>
                        <div class="form-group">
                            <label th:text="#{ui.nova_contrasenya}">Nova contrasenya</label>
                            <input name="password" placeholder="Deixa-ho buit si no la vols canviar" th:placeholder="#{ui.deixa_ho_buit_si_no_la_vols_canviar}" type="password"/>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <button class="btn-primary" th:text="#{ui.guardar_canvis}" type="submit">Guardar canvis</button>
                        <button class="btn-secondary" id="cancelBtn" th:text="#{ui.cancellar}" type="button">Cancel·lar</button>
                    </div>
                </form>
            </main>
        </div>
        <script>
            const form = document.getElementById("perfilForm");
            const cancelBtn = document.getElementById("cancelBtn");
            const fotoInput = document.getElementById("foto");
            const previewFoto = document.getElementById("previewFoto");

            let formChanged = false;

            form.querySelectorAll("input").forEach(input => {
                input.addEventListener("change", () => {
                    formChanged = true;
                });

                input.addEventListener("input", () => {
                    formChanged = true;
                });
            });

            if (fotoInput && previewFoto) {
                fotoInput.addEventListener("change", function () {
                    const file = this.files[0];

                    if (!file) {
                        return;
                    }

                    const reader = new FileReader();

                    reader.onload = function (e) {
                        previewFoto.src = e.target.result;
                    };

                    reader.readAsDataURL(file);
                });
            }

            form.addEventListener("submit", () => {
                formChanged = false;
            });

            window.addEventListener("beforeunload", function (event) {
                if (formChanged) {
                    event.preventDefault();
                    event.returnValue = "";
                }
            });

            cancelBtn.addEventListener("click", () => {
                if (formChanged) {
                    const confirmar = confirm("Tens canvis sense guardar. Vols sortir igualment?");

                    if (!confirmar) {
                        return;
                    }
                }

                window.location.href = "/panell";
            });
        </script>
    </body>
</html>
