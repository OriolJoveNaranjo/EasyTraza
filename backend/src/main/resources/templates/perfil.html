<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Perfil - EasyTraza</title>

        <link rel="stylesheet" th:href="@{/css/layout.css}">
        <link rel="stylesheet" th:href="@{/css/sidebar.css}">
        <link rel="stylesheet" th:href="@{/css/buttons.css}">
        <link rel="stylesheet" th:href="@{/css/perfil.css}">
    </head>

    <body>
        <div class="app-layout">

            <div th:replace="~{fragments/sidebar :: sidebar('perfil')}"></div>

            <main class="page-content">

                <div class="page-header">
                    <div>
                        <h1>El meu perfil</h1>
                        <p>Edita les teves dades personals</p>
                    </div>
                </div>

                <div th:if="${param.success}" class="profile-success">
                    Perfil actualitzat correctament.
                </div>

                <form id="perfilForm"
                      th:action="@{/perfil}"
                      method="post"
                      enctype="multipart/form-data"
                      class="profile-card">

                    <div class="profile-photo-section">
                        <img id="previewFoto"
                             class="profile-photo"
                             th:src="${usuari.foto != null and !#strings.isEmpty(usuari.foto)}
                             ? @{${'/uploads/usuaris/' + usuari.foto}}
                             : @{/images/usuaris/fotoPerfil.png}"
                             alt="Foto de perfil">

                        <label for="foto" class="photo-button">
                            Canviar foto
                        </label>

                        <input id="foto"
                               type="file"
                               name="foto"
                               accept="image/*"
                               hidden>
                    </div>

                    <div class="profile-fields">
                        <div class="form-group">
                            <label>Nom</label>
                            <input type="text"
                                   name="nom"
                                   th:value="${usuari.nom}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email"
                                   th:value="${usuari.email}"
                                   readonly
                                   class="readonly-input">
                        </div>

                        <div class="form-group">
                            <label>Rol</label>
                            <input type="text"
                                   th:value="${usuari.rol}"
                                   readonly
                                   class="readonly-input">
                        </div>

                        <div class="form-group">
                            <label>Nova contrasenya</label>
                            <input type="password"
                                   name="password"
                                   placeholder="Deixa-ho buit si no la vols canviar">
                        </div>
                    </div>

                    <div class="profile-actions">
                        <button type="submit" class="btn-primary">
                            Guardar canvis
                        </button>

                        <button type="button" id="cancelBtn" class="btn-secondary">
                            Cancel·lar
                        </button>
                    </div>
                </form>

            </main>

        </div>

        <script>
            const form = document.getElementById("perfilForm");
            const cancelBtn = document.getElementById("cancelBtn");
            const fotoInput = document.getElementById("foto");
            const previewFoto = document.getElementById("previewFoto");

            let formChanged = false;

            form.querySelectorAll("input").forEach(input => {
                input.addEventListener("change", () => {
                    formChanged = true;
                });

                input.addEventListener("input", () => {
                    formChanged = true;
                });
            });

            if (fotoInput && previewFoto) {
                fotoInput.addEventListener("change", function () {
                    const file = this.files[0];

                    if (!file) {
                        return;
                    }

                    const reader = new FileReader();

                    reader.onload = function (e) {
                        previewFoto.src = e.target.result;
                    };

                    reader.readAsDataURL(file);
                });
            }

            form.addEventListener("submit", () => {
                formChanged = false;
            });

            window.addEventListener("beforeunload", function (event) {
                if (formChanged) {
                    event.preventDefault();
                    event.returnValue = "";
                }
            });

            cancelBtn.addEventListener("click", () => {
                if (formChanged) {
                    const confirmar = confirm("Tens canvis sense guardar. Vols sortir igualment?");

                    if (!confirmar) {
                        return;
                    }
                }

                window.location.href = "/panell";
            });
        </script>

    </body>
</html>
