<!DOCTYPE html>

<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title th:text="#{ui.albarans_de_proveidor}">Albarans de proveïdor</title>
        <link rel="stylesheet" th:href="@{/css/layout.css}"/>
        <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>
        <link rel="stylesheet" th:href="@{/css/buttons.css}"/>
        <link rel="stylesheet" th:href="@{/css/table.css}"/>
    </head>
    <style>
        .inline-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
    <body>
        <div class="app-layout">
            <div th:replace="~{fragments/sidebar :: sidebar('albarans-proveidor')}"></div>
            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1 th:text="#{ui.albarans_de_proveidor}">Albarans de proveïdor</h1>
                        <p th:text="#{ui.recepcio_manual_d_albarans_amb_lots}">Recepció manual d'albarans amb lots</p>
                    </div>
                    <a class="btn-primary" th:href="@{/albarans-proveidor/nou}" th:text="#{ui.nou_albara}">+ Nou albarà</a>
                    <a class="btn-secondary" th:href="@{/albarans-proveidor/ocr}" th:text="#{ui.albara_amb_ocr}">Albarà amb OCR</a>
                </div>
                <div class="filter-card">
                    <form class="filter-bar" method="get" th:action="@{/albarans-proveidor}">
                        <select class="filter-select" name="proveidorId">
                            <option th:text="#{ui.proveidor}" value="">-- Proveïdor --</option>
                            <option th:each="p : ${proveidors}" th:selected="${proveidorId != null and proveidorId == p.id}" th:text="${p.nom}" th:value="${p.id}">
                            </option>
                        </select>
                        <select class="filter-select" name="ordre">
                            <option th:text="#{ui.ordenar}" value="">-- Ordenar --</option>
                            <option th:selected="${ordre == 'dataAsc'}" th:text="#{ui.data}" value="dataAsc">Data ↑</option>
                            <option th:selected="${ordre == 'dataDesc'}" th:text="#{ui.data_2}" value="dataDesc">Data ↓</option>
                        </select>
                        <button class="btn-primary" th:text="#{ui.filtrar}" type="submit">Filtrar</button>
                        <a class="btn-secondary" th:href="@{/albarans-proveidor}" th:text="#{ui.reset}">Reset</a>
                    </form>
                </div>
                <div class="content-card">
                    <table th:if="${not #lists.isEmpty(albarans)}">
                        <thead>
                            <tr>
                                <th th:text="#{ui.id}">ID</th>
                                <th th:text="#{ui.data_recepcio}">Data recepció</th>
                                <th th:text="#{ui.proveidor_2}">Proveïdor</th>
                                <th>Núm. albarà
                                <th th:text="#{ui.num_linies}">Núm. línies</th>
                                <th th:text="#{ui.accions}">Accions</th>
                                </th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="albara : ${albarans}">
                                <td th:text="${albara.id}"></td>
                                <td th:text="${albara.dataRecepcio}"></td>
                                <td th:text="${albara.proveidor != null ? albara.proveidor.nom : '-'}"></td>
                                <td th:text="${albara.numeroAlbara != null ? albara.numeroAlbara : '-'}"></td>
                                <td th:text="${albara.linies != null ? #lists.size(albara.linies) : 0}"></td>
                                <td>
                                    <a class="btn-view" th:href="@{'/albarans-proveidor/veure/' + ${albara.id}}" th:text="#{ui.veure}">Veure</a>
                                    <a class="btn-edit" th:href="@{'/albarans-proveidor/editar/' + ${albara.id}}" th:text="#{ui.editar}">Editar</a>
                                    <a class="btn-delete" onclick="return confirm('Segur que vols eliminar aquest albarà de proveïdor?')" th:href="@{'/albarans-proveidor/eliminar/' + ${albara.id}}" th:text="#{ui.eliminar}">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="empty-state" th:if="${#lists.isEmpty(albarans)}" th:text="#{ui.no_hi_ha_albarans_de_proveidor_registrats}">No hi ha albarans de proveïdor registrats</div>
                </div>
            </main>
        </div>
    </body>
    <script>
        async function processarOCR() {
            const fileInput = document.getElementById('ocrFile');
            const resultArea = document.getElementById('ocrResult');

            if (!fileInput.files.length) {
                alert('Selecciona una imatge');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            resultArea.value = 'Processant OCR...';

            try {
                const response = await fetch('/api/ocr/albara-proveidor', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.text();
                    resultArea.value = 'Error: ' + error;
                    return;
                }

                const data = await response.json();
                resultArea.value = data.textDetectat;

            } catch (error) {
                resultArea.value = 'Error: ' + error.message;
            }
        }
    </script>
</html>
